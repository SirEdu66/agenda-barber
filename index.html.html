<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Barber</title>
</head>
<body>
    <header>
        <h1>Agenda Barber</h1>
    </header>

    <nav>
        <ul>
            <li>Início</li>
            <li>Agenda</li>
            <li>Agendar</li>
        </ul>
    </nav>

    <main id="conteudo-principal">
        <section id="inicio">
            <h2>Painel do dia</h2>
            <p>Uma agenda cheia. Um bom dia de trabalho.</p>
            
            <h3>Os números do dia</h3>
            <ul>
                <li>Agendamentos: 08</li>
                <li>Concluídos: 02</li>
                <li>Faltas / cancelados: 01</li>
                <li>Faturamento previsto: R$ 460,00</li>
            </ul>
        </section>

        <section id="agendar" style="display: none;">
            <h2>Novo agendamento</h2>
            <form>
                <label>Cliente:</label>
                <input type="text" placeholder="Buscar por nome ou telefone">
                
                <label>Barbeiro:</label>
                <select>
                    <option>Rafael Mendes</option>
                    <option>Lucas Oliveira</option>
                </select>
                
                <label>Serviço:</label>
                <select>
                    <option>Corte (45 min - R$ 55,00)</option>
                    <option>Barba (30 min - R$ 40,00)</option>
                    <option>Combo (75 min - R$ 85,00)</option>
                </select>
                
                <button type="button">Agendar</button>
            </form>
        </section>
    </main>
</body>
</html>
